services:
  y-sweet:
    image: node:24-slim
    command: ["npx", "y-sweet@latest", "serve", "/data"]
    ports:
      - "5007:8080"
    volumes:
      - ysweet-data:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_POSTHOG_KEY: ${VITE_PUBLIC_POSTHOG_KEY}
        VITE_PUBLIC_POSTHOG_HOST: ${VITE_PUBLIC_POSTHOG_HOST}
        POSTHOG_CLI_ENV_ID: ${POSTHOG_CLI_ENV_ID}
        POSTHOG_CLI_HOST: ${POSTHOG_CLI_HOST}
        GIT_SHA: ${GIT_SHA}
      secrets:
        - posthog_cli_token
    ports:
      - "5008:5008"
    environment:
      - PORT=5008
      - YSWEET_CONNECTION_STRING=ys://y-sweet:8080
    env_file: "./.env"
    depends_on:
      - y-sweet
    restart: unless-stopped
    volumes:
      - ./audio-cache:/usr/src/app/audio-cache

volumes:
  ysweet-data:

secrets:
  posthog_cli_token:
    environment: POSTHOG_CLI_TOKEN
