[project]
name = "live-notes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "httpx-ws>=0.8.2",
    "lxml>=6.1.0",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "posthog>=7.13.1",
    "pycrdt>=0.12.43",
    "pycrdt-websocket>=0.16.0",
    "requests>=2.33.0",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "types-lxml>=2026.2.16",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# `slow` is deselected by default: it is the launcher suite, which shells out to
# real git/uv and costs ~25s to test a file almost no change touches. CI runs it
# (see .github/workflows/ci.yml); locally, `uv run pytest -m slow` does.
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: shells out to real git/uv subprocesses; opt-in locally, always on in CI",
]
