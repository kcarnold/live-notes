# fly.toml app configuration file generated for live-outline-ysweet on 2026-05-23T22:56:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'live-outline-ysweet'
primary_region = 'ord'

[build]
  image = 'node:24-slim'

[processes]
  app = 'npx y-sweet@latest serve /data --host 0.0.0.0 --url-prefix https://live-outline-ysweet.fly.dev'

[[mounts]]
  source = 'ysweet_data'
  destination = '/data'

[[services]]
  processes = ['app']
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
