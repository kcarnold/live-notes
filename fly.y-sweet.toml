# fly.toml app configuration file generated for live-outline-ysweet on 2026-05-23T22:56:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'live-outline-ysweet'
primary_region = 'ord'

[build]
  image = 'node:24-slim'

[processes]
  app = 'npx y-sweet@latest serve /data --host 0.0.0.0 --url-prefix https://live-outline-ysweet.fly.dev'

[[mounts]]
  source = 'ysweet_data'
  destination = '/data'

[[services]]
  processes = ['app']
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  # Count long-lived WebSocket connections as "active" so the machine
  # stays up while viewers are connected during a talk.
  [services.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
