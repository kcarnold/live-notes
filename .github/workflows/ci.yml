name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --no-color --run
      # `tsc -b` above only checks types. The production bundle can still fail on things
      # types can't see — an unresolved asset, a lazy import that doesn't split, a Tailwind
      # or plugin error — and nothing else in CI would notice until a deploy.
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Includes the `slow` launcher tests, which pyproject deselects locally.
      - run: uv run pytest -q -m "slow or not slow"
