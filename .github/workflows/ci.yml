name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --no-color --run
      # `tsc -b` above only checks types. The production bundle can still fail on things
      # types can't see — an unresolved asset, a lazy import that doesn't split, a Tailwind
      # or plugin error — and nothing else in CI would notice until a deploy.
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Includes the `slow` launcher tests, which pyproject deselects locally.
      - run: uv run pytest -q -m "slow or not slow"

  swift:
    # The macOS Audio Feeder is outside the npm and uv toolchains entirely, so nothing
    # above touches it. Only AudioFeederCore is covered here: it's a plain SwiftPM package
    # with no external dependencies, so this needs no xcodegen, no Xcode project, and no
    # dependency cache. The app half (CoreAudio/LiveKit/SwiftUI) has no test target and
    # isn't built here — see macos-audio-feeder/README.md for why the split exists.
    #
    # Standard macOS runners are unmetered on public repos. Keep this a standard label:
    # the larger runners (the `-xlarge` variants) are billed even here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test
        working-directory: macos-audio-feeder
